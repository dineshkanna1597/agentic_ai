[project]
name = "agentic-ai-job-board"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dineshkanna1597", email = "dineshkanna.socialmedia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "docx2txt>=0.9",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "grandalf>=0.8",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-litellm>=0.11.2",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-cli[inmem]>=0.4.40",
    "litellm[proxy]>=1.106.6",
    "ollama>=0.6.3",
    "phonenumbers>=9.0.42",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "spacy>=3.8.18",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
agentic-ai-job-board = "agentic_ai_job_board:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
